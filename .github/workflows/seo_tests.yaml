name: SEO Head Metadata Automation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  
  schedule:
    # Runs every monday
    - cron: '0 6 * * 1'

  workflow_dispatch:

jobs:
  run-seo-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest selenium webdriver-manager pytest-selenium requests beautifulsoup4

      - name: Execute PyTest SEO suite
        run: |
          python -m pytest tests/test_seo_head.py -n auto -v --junitxml=reports/junit-report.xml