name: SEO Head Metadata Automation

# Triggers: Defines when this pipeline will automatically execute
on:
  push:
    branches: [ main, master, feat/* ]
  pull_request:
    branches: [ main, master ]
  
  schedule:
    - cron: '0 6 * * 1'

# Jobs: List of tasks that run on virtual machines in the cloud
jobs:
  run-seo-tests:
    # Operating System hosted by GitHub for this run
    runs-on: ubuntu-latest

    steps:
      # Step 1: Downloads a copy of the repository code into the runner machine
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Step 2: Configures the Python runtime environment
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Installs Google Chrome for Selenium execution
      - name: Install Google Chrome browser
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      # Step 4: Installs project Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest selenium webdriver-manager pytest-selenium requests

      # Step 5: Executes the Selenium SEO test suite
      - name: Execute PyTest SEO suite
        run: |
          python -m pytest tests/test_seo_head.py -v